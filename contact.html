<!doctype html>
<html lang="en-LK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us | FRAGNIVO</title>
<meta name="description" content="Questions about a perfume, a decant or your order? Message FRAGNIVO on WhatsApp, call or email. We deliver in Sri Lanka and you pay on delivery.">
<link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.className = 'js';</script>
</head>
<body data-page="contact">
<main id="main" class="contact">
  <div class="contact__media"><img src="assets/img/shadow-gold.jpg" alt="Leaf shadow on a golden wall">
    <div class="contact__over">
      <h1 class="contact__title reveal">Not sure which one? <em>Just ask.</em></h1>
      <p class="reveal">We are happy to talk through a fragrance, an order or a delivery.</p>
    </div>
  </div>
  <div class="contact__side">
    <ul class="contact__ways reveal" data-contact-ways></ul>
    <form class="form" data-contact-form novalidate>
      <h2 class="form__h">Send a message</h2>
      <label class="field"><span>Your name</span><input name="name" autocomplete="name" required></label>
      <label class="field"><span>Phone</span><input name="phone" type="tel" autocomplete="tel" required></label>
      <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
      <label class="field"><span>Your message</span><textarea name="message" rows="4" required></textarea></label>
      <input class="hp" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">
      <p class="form__error" role="alert" hidden></p>
      <button class="btn btn--wide" type="submit">Send message</button>
      <div class="form__done" hidden></div>
    </form>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
